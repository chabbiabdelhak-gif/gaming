/* ------------------------------------------------------------------- noise */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function vnoise(x, z){
  const ix=Math.floor(x), iz=Math.floor(z), fx=x-ix, fz=z-iz;
  const u=fx*fx*(3-2*fx), v=fz*fz*(3-2*fz);
  const a=h2(ix,iz), b=h2(ix+1,iz), c=h2(ix,iz+1), d=h2(ix+1,iz+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x, z, o){let s=0,a=.5,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x,z);n+=a;x=x*2.03+17.1;z=z*2.03+9.7;a*=.5}return s/n}

/* ----------------------------------------------------------------- terrain */
const WORLD = 250, CELL = 10, GN = Math.ceil(WORLD * 2 / CELL);
const cgrid = Array.from({length: GN * GN}, () => []);
const fgrid = Array.from({length: GN * GN}, () => []);
function cellsOf(x, z, R, grid, item){
  const x0=Math.max(0,Math.floor((x-R+WORLD)/CELL)), x1=Math.min(GN-1,Math.floor((x+R+WORLD)/CELL));
  const z0=Math.max(0,Math.floor((z-R+WORLD)/CELL)), z1=Math.min(GN-1,Math.floor((z+R+WORLD)/CELL));
  for(let j=z0;j<=z1;j++)for(let i=x0;i<=x1;i++)grid[j*GN+i].push(item);
}
const cellAt=(x,z,grid)=>{const i=Math.floor((x+WORLD)/CELL), j=Math.floor((z+WORLD)/CELL);return(i<0||j<0||i>=GN||j>=GN)?null:grid[j*GN+i]};
function addCrater(x, z, r, dry){

  cellsOf(x,z,c.R,cgrid,c);
}

addCrater(-9, -9, 2.2, .5);
for(let i=0;i<230;i++){
  const a=rnd()*6.283, d=6+Math.sqrt(rnd())*165, x=Math.cos(a)*d, z=Math.sin(a)*d;

}
function footprint(x, z, r, s){cellsOf(x,z,r,fgrid,{x,z,r2:r*r,s})}

const gauss=(x,s)=>Math.exp(-(x*x)/(s*s));

  const l=(fbm(x*.21+40,z*.21,3)-.5)*.55+(fbm(x*.7,z*.7+90,2)-.5)*.13;
  let cr=0, dry=0, occ=0;
  const cell=cellAt(x,z,cgrid);
  if(cell) for(let k=0;k<cell.length;k++){
    const c=cell[k], dx=x-c.x, dz=z-c.z, d2=dx*dx+dz*dz;
    if(d2>c.R2) continue;
    const d=Math.sqrt(d2)/c.r*(.85+.3*vnoise(x*.9+c.s,z*.9));
    if(d<1){const q=1-d*d;cr-=c.depth*Math.pow(q,1.3);if(q>occ)occ=q}
    cr+=c.depth*.22*gauss(d-1.05,.22);

  const tb=x-(24+10*Math.sin(z*.018)+3*Math.sin(z*.06));
  const rut=-.1*(gauss(ta-.75,.2)+gauss(ta+.75,.2)+gauss(tb-.75,.2)+gauss(tb+.75,.2))

/* -------------------------------------------------- baked procedural maps */
const BAKE_FS = `
precision highp float;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}

float fbm(vec2 uv,vec2 per,int oct){float s=0.,a=.5,n=0.;for(int i=0;i<8;i++){if(i>=oct)break;s+=a*pn(uv*per+float(i)*3.7,per);n+=a;per*=2.;a*=.5;}return s/n;}

  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y));vec2 c=mod(i+g,per);
    vec2 o=vec2(hash(c),hash(c+57.31));d=min(d,length(g+o-f));}return d;}

    float base=fbm(uv+w*.08,vec2(4.),6);
    float clod=smoothstep(.35,.95,1.-worley(uv+w*.05,vec2(7.)));
    float clod2=smoothstep(.45,.95,1.-worley(uv+w*.03+.37,vec2(17.)));
    float peb=pow(1.-worley(uv,vec2(43.)),4.);
    float h=base*.42+clod*.3*smoothstep(.38,.6,fbm(uv+.5,vec2(5.),2))+clod2*.22+peb*.16;
    if(h<.38)h=mix(.38,h,.45);
    return h+fbm(uv,vec2(64.),3)*.035;
  }else if(mode<1.5){ // bark
    float w=fbm(uv,vec2(4.,3.),3);
    float r=1.-abs(2.*fbm(uv+vec2(w*.06,0.),vec2(14.,2.),4)-1.);
    return pow(r,1.5)*.7+fbm(uv,vec2(40.,8.),3)*.3;
  }else if(mode<2.5){ // sawn timber
    float g=fbm(uv,vec2(56.,3.),4);
    float crack=smoothstep(.66,.74,fbm(uv+.3,vec2(26.,1.),2));
    return g*.75+.25-crack*.5;
  }else{ // burlap
    float wv=sqrt((sin(uv.x*6.2832*96.)*.5+.5)*(sin(uv.y*6.2832*96.)*.5+.5));
    return wv*.45+fbm(uv,vec2(6.),4)*.55;
  }
}
vec3 C(vec2 uv,float h){
  if(mode<1.5){
    vec3 c=mix(vec3(.03,.028,.026),vec3(.15,.14,.125),h);
    c=mix(c,vec3(.016,.015,.015),smoothstep(.5,.62,fbm(uv+.2,vec2(3.,2.),3)));
    return mix(c,vec3(.11,.125,.1),.35*smoothstep(.55,.7,fbm(uv+.6,vec2(5.,4.),3)));

    vec3 c=mix(vec3(.04,.032,.026),vec3(.2,.165,.125),smoothstep(.2,.8,h));
    return c*(.6+.6*fbm(uv+.4,vec2(4.,2.),3));
  }

  c*=.72+.4*h;
  return mix(c,vec3(.085,.07,.055),smoothstep(.5,.72,fbm(uv+.8,vec2(4.),4))*.8);
}
void main(){
  float h=H(vUv);
  if(kind>.5){gl_FragColor=vec4(C(vUv,h),1.);return;}
  float hx=H(vUv+vec2(texel,0.)),hy=H(vUv+vec2(0.,texel));
  float k=.045/texel*(mode<.5?1.:.5);
  vec3 n=normalize(vec3((h-hx)*k,(h-hy)*k,1.));
  gl_FragColor=vec4(n*.5+.5,h);
}`;
const bakeMat = new THREE.ShaderMaterial({
  uniforms: {mode:{value:0}, kind:{value:0}, texel:{value:1}},
  vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader: BAKE_FS, depthTest: false, depthWrite: false});
const bakeScene = new THREE.Scene(); const bakeCam = new THREE.Camera();
bakeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bakeMat));
const MAXANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
function bake(mode, kind, size){
  const rt=new THREE.WebGLRenderTarget(size,size,{wrapS:THREE.RepeatWrapping,wrapT:THREE.RepeatWrapping,
    minFilter:THREE.LinearMipmapLinearFilter,magFilter:THREE.LinearFilter,generateMipmaps:true,depthBuffer:false,anisotropy:MAXANISO});

const TS = LOW ? 512 : 1024;
const tMud = bake(0, 0, LOW ? 1024 : 2048);
const tBarkN = bake(1, 0, TS), tBarkC = bake(1, 1, TS);
const tWoodN = bake(2, 0, TS), tWoodC = bake(2, 1, TS);
const tBagN = bake(3, 0, TS), tBagC = bake(3, 1, TS);

/* --------------------------------------------------------------------- sky */
const SKY_GLSL = `
float shash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float snoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(shash(i),shash(i+vec2(1.,0.)),f.x),mix(shash(i+vec2(0.,1.)),shash(i+vec2(1.,1.)),f.x),f.y);}
float sfbm(vec2 p){float s=0.,a=.5;for(int i=0;i<6;i++){s+=a*snoise(p);p=p*2.02+vec2(13.1,7.7);a*=.5;}return s;}
vec3 skyColor(vec3 d,float t,vec3 fogC){

  vec2 w=vec2(t*.012,t*.004);
  vec2 q=vec2(sfbm(p*1.3+3.+w),sfbm(p*1.3+9.-w));
  float n=sfbm(p*.75+w+q*.9);
  float n2=sfbm(p*2.4+w*2.+q*.5);

  col+=vec3(.1)*smoothstep(.55,.2,n)*smoothstep(.1,.6,d.y);
  return mix(fogC,col,smoothstep(.0,.3,d.y));

const skyMat = new THREE.ShaderMaterial({
  uniforms: {uTime, uFog: {value: FOG}},
  vertexShader: 'varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: 'varying vec3 vDir;uniform float uTime;uniform vec3 uFog;' + SKY_GLSL +
    'void main(){gl_FragColor=vec4(skyColor(normalize(vDir),uTime,uFog),1.);}',
  side: THREE.BackSide, depthWrite: false, fog: false});
const skyGeo = new THREE.SphereGeometry(1, 48, 24);
const sky = new THREE.Mesh(skyGeo, skyMat); sky.scale.setScalar(1200); sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky); noAO.push(sky);
{ // image-based lighting from the same overcast sky, with a mud-coloured ground bounce
  const es=new THREE.Scene(); const s=new THREE.Mesh(skyGeo,skyMat); s.scale.setScalar(40); es.add(s);
  const g=new THREE.Mesh(new THREE.CircleGeometry(40,24),new THREE.MeshBasicMaterial({color:new THREE.Color(.075,.068,.058)}));
  g.rotation.x=-Math.PI/2; g.position.y=-.5; es.add(g);
  const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(es,0,.1,100).texture; pm.dispose();
}
const sun = new THREE.DirectionalLight(new THREE.Color(1, .97, .92), 1.15);
const SUN_DIR = new V3(-.5, .78, .38).normalize();
sun.castShadow = true; sun.shadow.mapSize.set(LOW ? 1024 : 2048, LOW ? 1024 : 2048);
Object.assign(sun.shadow.camera, {left:-70, right:70, top:70, bottom:-70, near:1, far:320});
sun.shadow.bias = -.0006; sun.shadow.normalBias = .05;
scene.add(sun, sun.target);

/* ------------------------------------------------------------- geometry kit */
// Tapered tube along a polyline with parallel-transport frames; used for trunks, branches, wire.
function tubeGeo(pts, o){
  const RS=o.RS||6, n=pts.length, W=RS+1, cap=o.cap?1:0;
  const pos=new Float32Array((n*W+cap)*3), nor=new Float32Array((n*W+cap)*3), uv=new Float32Array((n*W+cap)*2);
  const idx=[]; const T=new V3, N=new V3, B=new V3, P=new V3, D=new V3; let have=false, len=0;
  for(let j=0;j<n;j++){
    T.subVectors(pts[Math.min(j+1,n-1)],pts[Math.max(j-1,0)]).normalize();
    if(!have){N.set(0,0,1);if(Math.abs(T.z)>.9)N.set(1,0,0);have=true}
    N.addScaledVector(T,-N.dot(T)).normalize(); B.crossVectors(T,N);
    if(j>0)len+=pts[j].distanceTo(pts[j-1]);
    const t=j/(n-1), r=o.rad(t,j);
    for(let i=0;i<W;i++){
      const a=i/RS*6.2832, c=Math.cos(a), s=Math.sin(a), ii=i%RS;
      const m=o.jit?o.jit(j,ii):1, lift=o.lift?o.lift(j,ii):0;
      D.set(0,0,0).addScaledVector(N,c).addScaledVector(B,s);
      P.copy(pts[j]).addScaledVector(D,r*m).addScaledVector(T,lift);
      const k=(j*W+i)*3; pos[k]=P.x;pos[k+1]=P.y;pos[k+2]=P.z; nor[k]=D.x;nor[k+1]=D.y;nor[k+2]=D.z;
      uv[(j*W+i)*2]=i/RS*(o.uRep||1); uv[(j*W+i)*2+1]=len*(o.vScale||1);
    }
  }
  for(let j=0;j<n-1;j++)for(let i=0;i<RS;i++){const a=j*W+i,b=a+W;idx.push(a,a+1,b,a+1,b+1,b)}
  if(cap){
    const k=n*W, e=pts[n-1]; pos[k*3]=e.x-T.x*.12;pos[k*3+1]=e.y-T.y*.12;pos[k*3+2]=e.z-T.z*.12;
    nor[k*3]=T.x;nor[k*3+1]=T.y;nor[k*3+2]=T.z; uv[k*2]=.5;uv[k*2+1]=len*(o.vScale||1);
    for(let i=0;i<RS;i++)idx.push(k,(n-1)*W+i,(n-1)*W+i+1);
  }

  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  g.setIndex(idx); return g;
}
const _m=new THREE.Matrix4, _q=new THREE.Quaternion, _e=new THREE.Euler, _s=new V3, _p=new V3;
function xform(g, x, y, z, rx, ry, rz, sx=1, sy=1, sz=1){
  _e.set(rx,ry,rz,'YXZ'); _q.setFromEuler(_e); _m.compose(_p.set(x,y,z),_q,_s.set(sx,sy,sz)); return g.applyMatrix4(_m);

// Beam whose long axis is local Y so wood grain runs along it.
function beam(len, w, d){
  const g=new THREE.BoxGeometry(w,len,d); const u=g.attributes.uv;
  for(let i=0;i<u.count;i++)u.setXY(i,u.getX(i)*.35+w,u.getY(i)*len*.45);
  return g;
}
const barkG=[], woodG=[], steelG=[], wireG=[], bagG=[];

/* ------------------------------------------------------------------- trees */
function tree(x, z, type){
  const tall=type==='snag', pole=type==='pole';
  const h=tall?rr(7,14):pole?rr(3.5,8):rr(1.6,5.2), r=tall?rr(.15,.25):pole?rr(.07,.13):rr(.2,.38);
  const la=rnd()*6.283, lean=(pole?.16:.09)*rnd()+(rnd()<.12?.35:0), seed=rnd()*100;
  const n=Math.max(7,Math.ceil(h/.45)), pts=[], y0=landY(x,z)-.5;
  for(let j=0;j<=n;j++){

    const bx=(vnoise(seed,y*.28)-.5)*r*1.5*(y/h), bz=(vnoise(seed+31,y*.28)-.5)*r*1.5*(y/h);

  }
  const RS=pole?7:11, spl=[]; for(let i=0;i<RS;i++)spl.push(rnd()<.28?rr(.5,1.3):rr(0,.3));
  const sharp=tall&&rnd()<.4, sk=r*(pole?2.5:3.2);

    rad:(t)=>r*(1-.5*t)*(1+.55*Math.exp(-t*(h+.5)/.4))*(sharp&&t>.9?(1-t)*10*.9+.1:1),
    jit:(j,i)=>(1+(vnoise(i*1.7+seed,j*.6)-.5)*.4)*(j===n&&!sharp?.72+.28*h2(i,j+7):1),
    lift:(j,i)=>j===n&&!sharp?spl[i]*sk:j===n-1&&!sharp?spl[i]*sk*.25:0}));

    const nb=Math.floor(rr(5,13));
    for(let b=0;b<nb;b++){
      const j0=Math.floor(rr(.3,.95)*n), a=rnd()*6.283, L=rr(.5,2.6)*(1-.5*j0/n), up=rr(.05,.6), bp=[];
      for(let k=0;k<=5;k++){const s=k/5;bp.push(new V3(
        pts[j0].x+Math.cos(a)*L*s+(rnd()-.5)*.12*s, pts[j0].y+up*L*s-.25*L*s*s+(rnd()-.5)*.1*s, pts[j0].z+Math.sin(a)*L*s+(rnd()-.5)*.12*s))}

      barkG.push(tubeGeo(bp,{RS:5,uRep:1,vScale:.8,rad:t=>r0*(1-t)+.008}));

void main(){vec4 t=texture2D(tPuff,vUv);float a=t.a*vAlpha*.85;if(a<.004)discard;
  float lit=clamp(t.r*.75+vAge*.45-vDark*.35*(1.-vAge),0.,1.);
  vec3 col=mix(vec3(.035,.036,.038),vec3(.42,.43,.43),lit);
  gl_FragColor=vec4(mix(col,uFog,vFog*.8),a);}`});
  const m=new THREE.Mesh(g,mat); m.frustumCulled=false; m.renderOrder=5; scene.add(m); noAO.push(m);
}
const fires=FIRES.map(([x,z,s])=>{
  const y=landY(x,z), tex=puff.clone(); tex.repeat.set(.5,.5); tex.offset.set(0,.5); tex.needsUpdate=true;
  const sprites=[]; for(let i=0;i<12;i++){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:new THREE.Color(4,1.2,.2),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,fog:false}));
    sp.userData={ph:rnd(),ox:rr(-.5,.5)*s,oz:rr(-.5,.5)*s}; scene.add(sp); sprites.push(sp); noAO.push(sp)}
  const light=new THREE.PointLight(new THREE.Color(1,.42,.12),0,34,2); light.position.set(x,y+1.1,z); scene.add(light);
  return{x,y,z,s,sprites,light};
});

/* -------------------------------------------------------------------- rain */
{
  const n=LOW?2500:7000, pos=new Float32Array(n*6), end=new Float32Array(n*2);
  for(let i=0;i<n;i++){const x=rnd(),y=rnd(),z=rnd();pos.set([x,y,z,x,y,z],i*6);end[i*2+1]=1}
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('aEnd',new THREE.BufferAttribute(end,1));
  const m=new THREE.LineSegments(g,new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uTime,uWind:{value:WIND}},
    vertexShader:`attribute float aEnd;uniform float uTime;uniform vec3 uWind;varying float vA;
void main(){vec3 box=vec3(36.,20.,36.);vec3 p=position*box;float sp=11.+4.*fract(position.x*71.3);
  p.y=mod(p.y-uTime*sp,box.y);p.xz+=uWind.xz*uTime*2.2;
  vec3 w;w.xz=cameraPosition.xz+mod(p.xz-cameraPosition.xz+box.xz*.5,box.xz)-box.xz*.5;w.y=cameraPosition.y-7.+p.y;
  w+=aEnd*vec3(uWind.x*.07,-.3,uWind.z*.05);
  vec4 mv=viewMatrix*vec4(w,1.);vA=smoothstep(34.,6.,-mv.z)*smoothstep(.3,2.,-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:'varying float vA;void main(){gl_FragColor=vec4(vec3(.72,.75,.76),vA*.075);}'}));
  m.frustumCulled=false; m.renderOrder=6; scene.add(m);
}

/* --------------------------------------------- distant artillery flashes */
const flash=new THREE.Sprite(new THREE.SpriteMaterial({map:fires[0].sprites[0].material.map,color:new THREE.Color(3,2.3,1.5),
  blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0,fog:false}));
flash.scale.set(90,40,1); scene.add(flash); noAO.push(flash);
let nextFlash=5, flashT=-1;

/* --------------------------------------------------------- post processing */
const rt=new THREE.WebGLRenderTarget(innerWidth*pixelRatio,innerHeight*pixelRatio,{type:THREE.HalfFloatType,samples:LOW?0:4});
const composer=new EffectComposer(renderer,rt);
composer.addPass(new RenderPass(scene,camera));
let gtao=null;
if(!LOW){
  gtao=new GTAOPass(scene,camera,innerWidth,innerHeight);
  gtao.updateGtaoMaterial({radius:.9,distanceExponent:1.4,thickness:1.2,scale:1.25,samples:12,distanceFallOff:1});
  const ov=gtao.overrideVisibility; gtao.overrideVisibility=function(){ov.call(this);for(const o of noAO)if(o)o.visible=false};
  composer.addPass(gtao);
}
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.3,.7,1.05));
composer.addPass(new OutputPass());
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},uT:{value:0}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uT;varying vec2 vUv;
float gh(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;float l=dot(c,vec3(.299,.587,.114));
  c=mix(vec3(l),c,.96)*vec3(.975,1.,.992);
  c=(c-.5)*1.07+.5;
  vec2 q=vUv-.5;c*=1.-dot(q,q)*.5;
  c+=(gh(vUv*913.+uT)-.5)*.022;
  gl_FragColor=vec4(c,1.);}`});
composer.addPass(grade);

/* ---------------------------------------------------------------- controls */
const cam=(Q.get('cam')||'').split(',').map(Number);
const player={x:cam[0]||0,z:cam.length>1?cam[1]:13,yaw:(cam[2]||0)*Math.PI/180,pitch:(cam.length>3?cam[3]:-2)*Math.PI/180,eye:cam[4]||1.6,y:0,bob:0};
player.y=groundY(player.x,player.z);
const keys={}; let crouch=false;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyC')crouch=!crouch;if(e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
const el=renderer.domElement; let drag=null;
el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(!drag)return;player.yaw-=(e.clientX-drag.x)*.0032;player.pitch=Math.max(-1.3,Math.min(1.3,player.pitch-(e.clientY-drag.y)*.0032));drag={x:e.clientX,y:e.clientY}});
const endDrag=()=>{drag=null}; el.addEventListener('pointerup',endDrag); el.addEventListener('pointercancel',endDrag);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});

/* -------------------------------------------------------------------- loop */
const clock=new THREE.Clock(); let slow=0, tier=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.1), t=uTime.value+=dt;
  const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0), s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  if(f||s){
    const sp=(keys.ShiftLeft||keys.ShiftRight?6.2:2.9)*(crouch?.5:1)/Math.hypot(f,s)*dt, sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
    player.x+=(-sy*f+cy*s)*sp; player.z+=(-cy*f-sy*s)*sp;
    const d=Math.hypot(player.x,player.z); if(d>105){player.x*=105/d;player.z*=105/d}
    player.bob+=dt*(keys.ShiftLeft||keys.ShiftRight?11:7.5);
  }
  const eye=cam[4]||(crouch?.62:1.6);
  player.eye+=(eye-player.eye)*Math.min(1,dt*8);
  player.y+=(groundY(player.x,player.z)-player.y)*Math.min(1,dt*9);
  camera.position.set(player.x,player.y+player.eye+Math.sin(player.bob)*.028,player.z);
  camera.rotation.set(player.pitch,player.yaw,0);
  sky.position.copy(camera.position);
  const sx=Math.round(player.x/6)*6, sz=Math.round(player.z/6)*6;
  sun.target.position.set(sx,0,sz); sun.position.set(sx,0,sz).addScaledVector(SUN_DIR,150);
  for(const fr of fires){
    const fl=.6+.4*Math.sin(t*17.3+fr.x)*Math.sin(t*7.1)+.25*Math.sin(t*31.);
    fr.light.intensity=55*fr.s*(.75+.25*fl);
    for(const sp of fr.sprites){const u=sp.userData,a=(t*.9+u.ph)%1,sc=fr.s*(.95-a*.6);
      sp.position.set(fr.x+u.ox*(1-a*.6),fr.y+.3+a*2.2*fr.s,fr.z+u.oz*(1-a*.6));sp.scale.set(sc,sc*1.35,1);
      sp.material.opacity=Math.sin(a*3.1416)*.4;sp.material.rotation=u.ph*6+t*.6}
  }
  if(t>nextFlash){flashT=t;nextFlash=t+4+Math.random()*11;const a=Math.random()*6.283;flash.position.set(player.x+Math.cos(a)*175,player.y+9,player.z+Math.sin(a)*175)}
  const fa=t-flashT; flash.material.opacity=flashT>=0&&fa<.5?Math.exp(-fa*9)*(.75+.25*Math.sin(fa*90)):0;
  grade.uniforms.uT.value=t%10;
  composer.render();
  // step quality down if the device cannot hold ~30 fps
  slow=dt>.04?slow+dt:Math.max(0,slow-dt*2);
  if(slow>3&&tier<2&&!Q.get('cam')){slow=0;tier++;
    if(tier===1){pixelRatio=1;renderer.setPixelRatio(1);composer.setPixelRatio(1)}
    else if(gtao)gtao.enabled=false}
  requestAnimationFrame(frame);
}
uTime.value=40;
frame();
document.getElementById('load').classList.add('done');
window.__ready=true;
</script>
</body>
