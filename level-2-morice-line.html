  const N=LOW?500:1300, im=new THREE.InstancedMesh(g,new THREE.MeshStandardMaterial({color:C3(.085,.088,.092),roughness:.24,normalMap:tMud,normalScale:new THREE.Vector2(1.6,1.6)}),N);
  for(let i=0;i<N;i++){const a=rnd()*6.283,d=1+Math.pow(rnd(),.7)*62,x=Math.cos(a)*d,z=Math.sin(a)*d,s=.025+rnd()*rnd()*rnd()*.3;
    _e.set(rnd()*6,rnd()*6,rnd()*6);_q.setFromEuler(_e);_m.compose(_p.set(x,landY(x,z)+s*.12,z),_q,_s.set(s*rr(.8,1.5),s*rr(.4,.75),s*rr(.8,1.5)));im.setMatrixAt(i,_m)}
  im.castShadow=true; im.receiveShadow=true; im.frustumCulled=false; scene.add(im);
  const tg=new THREE.CylinderGeometry(.007,.012,1,5), TNn=LOW?500:1500, tw=new THREE.InstancedMesh(tg,barkMat,TNn);
  for(let i=0;i<TNn;i++){const a=rnd()*6.283,d=1+Math.sqrt(rnd())*55,x=Math.cos(a)*d,z=Math.sin(a)*d,L=rr(.15,.7);
    _e.set(Math.PI/2+rr(-.12,.12),rnd()*6.283,0);_q.setFromEuler(_e);_m.compose(_p.set(x,landY(x,z)+.015,z),_q,_s.set(rr(.6,1.4),L,rr(.6,1.4)));tw.setMatrixAt(i,_m)}
  tw.receiveShadow=true; tw.frustumCulled=false; scene.add(tw); noAO.push(tw);
}
{ // rain drops hanging on the live wires
  const dm=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.0065,1),
    new THREE.MeshStandardMaterial({color:C3(.8,.9,1),roughness:.14,metalness:1,emissive:C3(.2,.28,.4)}),dropM.length);
  dropM.forEach((d,i)=>{_m.compose(_p.set(d[0],d[1],d[2]),_q.identity(),_s.set(1,1.35,1));dm.setMatrixAt(i,_m)});
  dm.frustumCulled=false; scene.add(dm); noAO.push(dm);
}

/* ------------------------------------------------- searchlight and sparks */
const spot=new THREE.SpotLight(C3(1,.95,.84),2200,150,.105,.55,1.5);
spot.position.copy(towerLight); scene.add(spot, spot.target);
if(!LOW){spot.castShadow=true;spot.shadow.mapSize.set(1024,1024);spot.shadow.camera.near=2;spot.shadow.camera.far=120;spot.shadow.bias=-.0008}
const CONE=70;
const coneGeo=new THREE.ConeGeometry(Math.tan(.105)*CONE,CONE,32,1,true); coneGeo.translate(0,-CONE/2,0);
const cone=new THREE.Mesh(coneGeo,new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,fog:false,
  vertexShader:`varying float vL;varying vec3 vN,vV;void main(){vL=-position.y/${CONE}.;vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:'varying float vL;varying vec3 vN,vV;void main(){float f=pow(abs(dot(normalize(vN),normalize(vV))),2.2);float a=f*pow(clamp(1.-vL,0.,1.),1.7)*smoothstep(0.,.015,vL)*.5;gl_FragColor=vec4(vec3(.75,.82,.95)*a,1.);}'}));
cone.position.copy(towerLight); cone.frustumCulled=false; cone.renderOrder=7; scene.add(cone); noAO.push(cone);
const lens=new THREE.Sprite(new THREE.SpriteMaterial({map:tGlow,color:C3(3,2.9,2.6),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,fog:false}));
lens.position.copy(towerLight); lens.scale.set(2.2,2.2,1); scene.add(lens); noAO.push(lens);
const spark=new THREE.Sprite(new THREE.SpriteMaterial({map:tGlow,color:C3(5,7,12),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0,fog:false}));
scene.add(spark); noAO.push(spark);
const sparkLight=new THREE.PointLight(C3(.5,.7,1),0,14,2); scene.add(sparkLight);
let nextSpark=3, sparkT=-9, nextBolt=9, boltT=-9;

/* ------------------------------------------------------------ mist and rain */
{
  const n=LOW?40:90, g=new THREE.InstancedBufferGeometry(), base=new THREE.PlaneGeometry(1,1);
  g.index=base.index; g.setAttribute('position',base.attributes.position);
  const ap=new Float32Array(n*3), ar=new Float32Array(n*2);
  for(let i=0;i<n;i++){ap[i*3]=rr(-70,70);ap[i*3+1]=rr(.4,3.4);ap[i*3+2]=rr(-70,70);ar[i*2]=rnd();ar[i*2+1]=rnd()}
  g.setAttribute('aPos',new THREE.InstancedBufferAttribute(ap,3)); g.setAttribute('aRnd',new THREE.InstancedBufferAttribute(ar,2)); g.instanceCount=n;
  const m=new THREE.Mesh(g,new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uTime,tPuff:{value:tPuff},uWind:{value:WIND},uFog:{value:FOG},uBase:{value:0}},
    vertexShader:`attribute vec3 aPos;attribute vec2 aRnd;uniform float uTime,uBase;uniform vec3 uWind;varying vec2 vUv;varying float vA;
void main(){vec3 p=aPos;p.xz+=uWind.xz*uTime*(.3+.3*aRnd.x);
  p.xz=cameraPosition.xz+mod(p.xz-cameraPosition.xz+70.,140.)-70.;p.y+=uBase;
  vec4 mv=viewMatrix*vec4(p,1.);mv.xy+=position.xy*mix(13.,26.,aRnd.x);
  vA=smoothstep(4.,16.,-mv.z)*smoothstep(72.,40.,-mv.z);
  float v=floor(aRnd.y*4.);vUv=(position.xy+.5+vec2(mod(v,2.),floor(v*.5)))*.5;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:'uniform sampler2D tPuff;uniform vec3 uFog;varying vec2 vUv;varying float vA;void main(){float a=texture2D(tPuff,vUv).a*vA*.2;if(a<.003)discard;gl_FragColor=vec4(uFog*1.5,a);}'}));
  m.frustumCulled=false; m.renderOrder=5; scene.add(m); noAO.push(m); scene.userData.mist=m;
}
{
  const n=LOW?3500:10000, pos=new Float32Array(n*6), end=new Float32Array(n*2);
  for(let i=0;i<n;i++){const x=rnd(),y=rnd(),z=rnd();pos.set([x,y,z,x,y,z],i*6);end[i*2+1]=1}
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('aEnd',new THREE.BufferAttribute(end,1));
  const m=new THREE.LineSegments(g,new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uTime,uWind:{value:WIND},uFlash},
    vertexShader:`attribute float aEnd;uniform float uTime;uniform vec3 uWind;varying float vA;
void main(){vec3 box=vec3(32.,20.,32.);vec3 p=position*box;float sp=12.+4.*fract(position.x*71.3);
  p.y=mod(p.y-uTime*sp,box.y);p.xz+=uWind.xz*uTime*2.2;
  vec3 w;w.xz=cameraPosition.xz+mod(p.xz-cameraPosition.xz+box.xz*.5,box.xz)-box.xz*.5;w.y=cameraPosition.y-7.+p.y;
  w+=aEnd*vec3(uWind.x*.06,-.24,uWind.z*.04);
  vec4 mv=viewMatrix*vec4(w,1.);vA=smoothstep(30.,5.,-mv.z)*smoothstep(.3,2.,-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:'uniform float uFlash;varying float vA;void main(){gl_FragColor=vec4(vec3(.5,.6,.72)*(1.+uFlash*6.),vA*.075);}'}));
  m.frustumCulled=false; m.renderOrder=6; scene.add(m);
}

/* --------------------------------------------------------- post processing */
const rt=new THREE.WebGLRenderTarget(innerWidth*pixelRatio,innerHeight*pixelRatio,{type:THREE.HalfFloatType,samples:LOW?0:4});
const composer=new EffectComposer(renderer,rt);
composer.addPass(new RenderPass(scene,camera));
// Clamp HDR and drop NaN/Inf before bloom: one bad pixel otherwise spreads into large black squares.
composer.addPass(new ShaderPass({uniforms:{tDiffuse:{value:null}},
  vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
  fragmentShader:"uniform sampler2D tDiffuse;varying vec2 vUv;float fx(float x){return (x>=0.&&x<=48.)?x:((x>48.)?48.:0.);}void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;gl_FragColor=vec4(fx(c.r),fx(c.g),fx(c.b),1.);}"}));
let gtao=null;
if(!LOW){
  gtao=new GTAOPass(scene,camera,innerWidth,innerHeight);
  gtao.updateGtaoMaterial({radius:.8,distanceExponent:1.4,thickness:1.2,scale:1.2,samples:12,distanceFallOff:1});
  const ov=gtao.overrideVisibility; gtao.overrideVisibility=function(){ov.call(this);for(const o of noAO)if(o)o.visible=false};
  composer.addPass(gtao);
}
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.42,.75,1.0));
composer.addPass(new OutputPass());
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},uT:{value:0}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uT;varying vec2 vUv;
float gh(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;float l=dot(c,vec3(.299,.587,.114));
  c=mix(vec3(l),c,.92);
  c=mix(c*vec3(.9,1.,1.1),c*vec3(1.05,1.,.94),smoothstep(.25,.8,l));
  c=(c-.5)*1.08+.5;
  vec2 q=vUv-.5;c*=1.-dot(q,q)*.75;
  c+=(gh(vUv*913.+uT)-.5)*.02;
  gl_FragColor=vec4(c,1.);}`});
composer.addPass(grade);

/* ---------------------------------------------------------------- controls */
const cam=(Q.get('cam')||'').split(',').map(Number);
const hasCam=Q.has('cam');
const player={x:hasCam?cam[0]:pathX(7.5),z:hasCam?cam[1]:7.5,yaw:(cam[2]||0)*Math.PI/180,pitch:(cam.length>3?cam[3]:1)*Math.PI/180,eye:cam[4]||1.6,y:0,bob:0};
player.y=groundY(player.x,player.z);
const keys={}; let crouch=false;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyC')crouch=!crouch;if(e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
const el=renderer.domElement; let drag=null;
el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(!drag)return;player.yaw-=(e.clientX-drag.x)*.0032;player.pitch=Math.max(-1.3,Math.min(1.3,player.pitch-(e.clientY-drag.y)*.0032));drag={x:e.clientX,y:e.clientY}});
const endDrag=()=>{drag=null}; el.addEventListener('pointerup',endDrag); el.addEventListener('pointercancel',endDrag);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});

/* -------------------------------------------------------------------- loop */
const clock=new THREE.Clock(); let slow=0, tier=0; const DOWN=new V3(0,-1,0), _d=new V3;
function frame(){
  const dt=Math.min(clock.getDelta(),.1), t=uTime.value+=dt;
  const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0), s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  if(f||s){
    const sp=(keys.ShiftLeft||keys.ShiftRight?6:2.8)*(crouch?.5:1)/Math.hypot(f,s)*dt, sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
    let nx=player.x+(-sy*f+cy*s)*sp, nz=player.z+(-cy*f-sy*s)*sp;
    for(const tr of trunks){const dx=nx-tr[0], dz=nz-tr[1], d=Math.hypot(dx,dz); if(d<tr[2]&&d>1e-4){nx=tr[0]+dx/d*tr[2];nz=tr[1]+dz/d*tr[2]}}
    const d=Math.hypot(nx,nz); if(d>62){nx*=62/d;nz*=62/d}
    player.x=nx; player.z=nz; player.bob+=dt*(keys.ShiftLeft||keys.ShiftRight?11:7.5);
  }
  const eye=cam[4]||(crouch?.62:1.6);
  player.eye+=(eye-player.eye)*Math.min(1,dt*8);
  player.y+=(groundY(player.x,player.z)-player.y)*Math.min(1,dt*9);
  camera.position.set(player.x,player.y+player.eye+Math.sin(player.bob)*.028,player.z);
  camera.rotation.set(player.pitch,player.yaw,0);
  sky.position.copy(camera.position);
  scene.userData.mist.material.uniforms.uBase.value=player.y;
  const sx=Math.round(player.x/6)*6, sz=Math.round(player.z/6)*6;
  sun.target.position.set(sx,0,sz); sun.position.set(sx,0,sz).addScaledVector(MOON_DIR,150);
  // searchlight sweeps along the wire
  const lx=towerLight.x-12+48*Math.sin(t*.11), lz=fenceZ(lx)+3*Math.sin(t*.23);
  spot.target.position.set(lx,landY(lx,lz),lz);
  _d.subVectors(spot.target.position,towerLight).normalize(); cone.quaternion.setFromUnitVectors(DOWN,_d);
  // arcing on the wet insulators
  if(t>nextSpark&&HV.length){sparkT=t;nextSpark=t+1.5+Math.random()*5;
    let best=HV[0],bd=1e9;for(let k=0;k<8;k++){const h=HV[Math.floor(Math.random()*HV.length)],d=Math.hypot(h.x-player.x,h.z-player.z)+Math.random()*14;if(d<bd){bd=d;best=h}}
    spark.position.copy(best);sparkLight.position.copy(best)}
  const sa=t-sparkT, sv=sa<.22?(.5+.5*Math.sin(sa*140))*Math.exp(-sa*9):0;
  spark.material.opacity=sv; spark.scale.setScalar(.25+sv*.5); sparkLight.intensity=sv*26;
  for(let i=0;i<lampLights.length;i++)lampLights[i].intensity=70*(.93+.07*Math.sin(t*23+i*4)*Math.sin(t*7.3));
  // sheet lightning
  if(t>nextBolt){boltT=t;nextBolt=t+12+Math.random()*24}
  const ba=t-boltT, bolt=ba<.7?Math.max(0,Math.sin(ba*31))*Math.exp(-ba*5)*(ba<.12||ba>.22?1:.15):0;
  uFlash.value=bolt*.5; sun.intensity=MOON_I+bolt*7; FOG.copy(FOG0).multiplyScalar(1+bolt*5);
  grade.uniforms.uT.value=t%10;
  composer.render();
  // step quality down if the device cannot hold ~30 fps
  slow=dt>.04?slow+dt:Math.max(0,slow-dt*2);
  if(slow>3&&tier<3&&!hasCam){slow=0;tier++;
    if(tier===1){pixelRatio=1;renderer.setPixelRatio(1);composer.setPixelRatio(1)}
    else if(tier===2){if(gtao)gtao.enabled=false}
    else spot.castShadow=false}
  requestAnimationFrame(frame);
}
uTime.value=Number(Q.get("t"))||30; nextBolt=uTime.value+9; nextSpark=uTime.value+3;
frame();
document.getElementById('load').classList.add('done');
window.__ready=true;
</script>
