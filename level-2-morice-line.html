/* --------------------------------------------------------------------- sky */
const SKY_GLSL = `

// Tapered tube along a polyline with parallel-transport frames; used for trunks, branches, wire.

    spark.position.copy(best);sparkLight.position.copy(best)}
  const sa=t-sparkT, sv=sa<.22?(.5+.5*Math.sin(sa*140))*Math.exp(-sa*9):0;
  spark.material.opacity=sv; spark.scale.setScalar(.25+sv*.5); sparkLight.intensity=sv*26;
  for(let i=0;i<lampLights.length;i++)lampLights[i].intensity=70*(.93+.07*Math.sin(t*23+i*4)*Math.sin(t*7.3));
  // sheet lightning
  if(t>nextBolt){boltT=t;nextBolt=t+12+Math.random()*24}
  const ba=t-boltT, bolt=ba<.7?Math.max(0,Math.sin(ba*31))*Math.exp(-ba*5)*(ba<.12||ba>.22?1:.15):0;
  uFlash.value=bolt*.5; sun.intensity=MOON_I+bolt*7; FOG.copy(FOG0).multiplyScalar(1+bolt*5);
  grade.uniforms.uT.value=t%10;
  composer.render();
  // step quality down if the device cannot hold ~30 fps
  slow=dt>.04?slow+dt:Math.max(0,slow-dt*2);
  if(slow>3&&tier<3&&!hasCam){slow=0;tier++;
    if(tier===1){pixelRatio=1;renderer.setPixelRatio(1);composer.setPixelRatio(1)}
    else if(tier===2){if(gtao)gtao.enabled=false}
    else spot.castShadow=false}
  requestAnimationFrame(frame);
}
uTime.value=Number(Q.get("t"))||30;
frame();
document.getElementById('load').classList.add('done');
window.__ready=true;
</script>
